# KILN_AutoColor's Moonraker part (Kiln OS includes it while the plugin is
# on): updates from Mainsail or Fluidd (Software Updates). Klipper restarts
# after an update, which loads the new code.
[update_manager kiln-autocolor]
type: git_repo
path: /data/ad5x/plugins/autocolor
origin: https://github.com/DIEHARDave/KILN_AutoColor.git
primary_branch: main
is_system_service: False
managed_services: klipper
