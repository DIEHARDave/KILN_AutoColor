# KILN_AutoColor: map the slicer's tools to the IFS slots by color and
# material when a print starts. See README.md.
#
# Kiln includes this file while the plugin is enabled, and plugin updates
# replace it. To change an option, add a [kiln_autocolor] section of your own
# to local.cfg; Klipper merges both sections, and yours win.
#
# All options and their defaults:
#
#   enabled: True
#       Map at print start. AUTOCOLOR_ENABLE ENABLE=0|1 switches it and
#       keeps the choice in save_variables, which then wins over this.
#   respect_manual_map: True
#       Leave the tool map alone when it was already changed before the
#       print started (IFS_MAP_TOOL, HelixScreen's tool mapping).
#   stop_on_mismatch: False
#       Refuse to start a print when a tool's material isn't loaded in any
#       slot (or the file uses T4 or higher), instead of printing with the
#       closest slot.
#   family_penalty: 10
#   share_penalty: 60
#       Color differences are CIE76 delta E (about 2: just visible, 100:
#       black to white; 30 or more is reported as a weak match).
#       family_penalty: how much closer in color a slot of the same family
#       (PLA+ for PLA) must be to win over one of the exact type.
#       share_penalty: how much closer two of the file's colors must get by
#       sharing one slot than by taking a slot each. 0 gives every tool its
#       closest slot, as zMod does.

[kiln_autocolor]
